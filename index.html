// assets/regions/drawClock.js
function drawClock(context, width, height) {
  context.fillStyle = BRAND.navy;
  context.fillRect(0, 0, width, height);
  fillCircle(context, width / 2, height / 2, width * 0.44, "#ffffff");
  context.strokeStyle = "#1b1d22";
  for (let tick = 0; tick < 12; tick += 1) {
    const angle = tick / 12 * Math.PI * 2;
    context.lineWidth = tick % 3 === 0 ? 5 : 2;
    context.beginPath();
    context.moveTo(width / 2 + Math.cos(angle) * width * 0.34, height / 2 + Math.sin(angle) * width * 0.34);
    context.lineTo(width / 2 + Math.cos(angle) * width * 0.4, height / 2 + Math.sin(angle) * width * 0.4);
    context.stroke();
  }
  context.lineCap = "round";
  context.lineWidth = 6;
  context.beginPath();
  context.moveTo(width / 2, height / 2);
  context.lineTo(width / 2 + Math.cos(-Math.PI / 2 + 0.6) * width * 0.2, height / 2 + Math.sin(-Math.PI / 2 + 0.6) * width * 0.2);
  context.stroke();
  context.lineWidth = 4;
  context.beginPath();
  context.moveTo(width / 2, height / 2);
  context.lineTo(width / 2 + Math.cos(-Math.PI / 2 + 1.78) * width * 0.32, height / 2 + Math.sin(-Math.PI / 2 + 1.78) * width * 0.32);
  context.stroke();
  context.lineCap = "butt";
}

  const rows = 2;
  const cellWidth = (width - 12) / columns;
  const cellHeight = (height - 12) / rows;

    (x, y) => {
      fillCircle(context, x, y, 14, "#f1e0b8");

      context.lineTo(x, y - 14);
      context.closePath();
      context.fill();

      fillEllipse(context, width * 0.36, height * 0.6, width * 0.14, height * 0.07, 0.4, "#e9b44c");
      fillEllipse(context, width * 0.64, height * 0.68, width * 0.13, height * 0.06, -0.3, "#efc25e");
      drawText(context, word, width / 2, height * 0.3, { color: "#ffffff", family: FONT_ROUNDED, maxWidth: width * 0.92, size: height * 0.2, stroke: accent, strokeWidth: 5, weight: 800 });
      drawGloss(context, 0, 0, width, height, 0.4);
      break;
    }
    case 1: {
      context.fillStyle = base;
      context.fillRect(0, 0, width, height);
      context.fillStyle = accent;
      context.fillRect(0, 0, width, height * 0.22);
      context.fillStyle = "rgba(255, 255, 255, 0.85)";
      context.fillRect(0, height * 0.8, width, height * 0.06);
      fillCircle(context, width * 0.5, height * 0.58, width * 0.2, "rgba(255, 255, 255, 0.9)");
      fillCircle(context, width * 0.5, height * 0.58, width * 0.13, "#7b4a2b");
      drawText(context, word, width / 2, height * 0.11, { color: "#ffffff", family: FONT_ROUNDED, maxWidth: width * 0.9, size: height * 0.14, weight: 800 });
      break;
    }
    case 2: {
      const gradient = context.createLinearGradient(0, 0, 0, height);
      gradient.addColorStop(0, "#ffffff");
      gradient.addColorStop(1, base);
      context.fillStyle = gradient;
      context.fillRect(0, 0, width, height);
      fillRoundedRect(context, width * 0.12, height * 0.36, width * 0.76, height * 0.34, 8, accent);
      drawText(context, word, width / 2, height * 0.53, { color: "#ffffff", family: FONT_ROUNDED, maxWidth: width * 0.7, size: height * 0.13, weight: 800 });
      drawGloss(context, 0, 0, width * 0.5, height, 0.5);
      break;
    }
    case 3: {
      context.fillStyle = "#f6f2e8";
      context.fillRect(0, 0, width, height);
      context.fillStyle = accent;
      context.fillRect(0, height * 0.12, width, height * 0.3);
      context.fillStyle = base === "#f6f2e8" ? "#d23a5f" : base;
      context.fillRect(0, height * 0.82, width, height * 0.08);
      drawText(context, word, width / 2, height * 0.27, { color: "#ffffff", family: FONT_ROUNDED, maxWidth: width * 0.9, size: height * 0.16, stroke: "rgba(0, 0, 0, 0.25)", strokeWidth: 3, weight: 800 });
      fillEllipse(context, width * 0.5, height * 0.62, width * 0.3, height * 0.1, 0, "#f2c46a");
      fillCircle(context, width * 0.4, height * 0.6, width * 0.07, "#e36b4a");
      fillCircle(context, width * 0.62, height * 0.63, width * 0.06, "#5a9e4b");
      break;
    }
  }
}

// assets/regions/drawPackageSheet.js
function drawPackageSheet(context, width, height) {
  const cellWidth = width / PACKAGE_COLUMNS;
  const cellHeight = height / PACKAGE_ROWS;
  for (let row = 0; row < PACKAGE_ROWS; row += 1) {
    for (let column = 0; column < PACKAGE_COLUMNS; column += 1) {
      const index = row * PACKAGE_COLUMNS + column;
      const accent = PACKAGE_PALETTE[(column * 7 + row * 5 + 3) % PACKAGE_PALETTE.length];
      context.save();
      context.translate(column * cellWidth, row * cellHeight);
      context.beginPath();
      context.rect(0, 0, cellWidth, cellHeight);
      context.clip();
      drawPackageFace(context, cellWidth, cellHeight, row, packageColors[index], accent, PACKAGE_WORDS[row][column]);
      context.restore();
    }
  }
}

// assets/regions/drawSpokes.js
function drawSpokes(context, width, height) {
  context.clearRect(0, 0, width, height);
  const center = width / 2;
  context.strokeStyle = "#d6dbe1";
  context.lineWidth = 2;
  for (let spoke = 0; spoke < 32; spoke += 1) {
    const angle = spoke / 32 * Math.PI * 2;
    const hubAngle = angle + (spoke % 2 === 0 ? 0.35 : -0.35);
    context.beginPath();
    context.moveTo(center + Math.cos(hubAngle) * 12, center + Math.sin(hubAngle) * 12);
    context.lineTo(center + Math.cos(angle) * width * 0.47, center + Math.sin(angle) * width * 0.47);
    context.stroke();
  }
  fillCircle(context, center, center, 14, "#b9bec5");
}

// assets/regions/drawStoreFloor.js
function drawStoreFloor(context, width, height) {
  const scaleX = width / 9;
  const scaleY = height / 7;
  const toFloorX = (x) => {
    return (x + 5.2) * scaleX;
  };
  const toFloorY = (z) => {
    return (z + 8) * scaleY;
  };
  context.fillStyle = "#efe7d7";
  context.fillRect(0, 0, width, height);
  const tile = 0.3 * scaleX;
  for (let y = 0; y < height; y += tile) {
    for (let x = 0; x < width; x += tile) {
      const shade = 230 + Math.floor(random() * 10);
      context.fillStyle = `rgb(${shade + 8}, ${shade}, ${shade - 16})`;
      context.fillRect(x + 1, y + 1, tile - 2, tile - 2);
    }
  }
  context.strokeStyle = "rgba(160, 140, 110, 0.35)";
  context.lineWidth = 1.5;
  for (let y = 0; y <= height; y += tile) {
    context.beginPath();
    context.moveTo(0, y);
    context.lineTo(width, y);
    context.stroke();
  }
  for (let x = 0; x <= width; x += tile) {
    context.beginPath();
    context.moveTo(x, 0);
    context.lineTo(x, height);
    context.stroke();
  }
  for (let index = 0; index < 26; index += 1) {
    const x = toFloorX(randomBetween(0.9, 2.9));
    const y = toFloorY(randomBetween(-2.6, -1.1));
    fillEllipse(context, x, y, randomBetween(6, 18), randomBetween(4, 10), random() * 3, "rgba(120, 110, 95, 0.16)");
  }
  const stickerX = toFloorX(1.4);
  const stickerY = toFloorY(-3.55);
  fillRoundedRect(context, stickerX - 58, stickerY - 20, 116, 40, 12, "#ffd449");
  drawText(context, "\u3053\u3061\u3089\u306B\u304A\u4E26\u3073\u304F\u3060\u3055\u3044", stickerX, stickerY, { color: BRAND.navy, family: FONT_ROUNDED, maxWidth: 104, size: 14, weight: 800 });
  for (const z of [-2.95, -2.35, -1.75]) {
    for (const side of [-1, 1]) {
      const footX = toFloorX(1.4 + side * 0.09);
      const footY = toFloorY(z);
      fillEllipse(context, footX, footY, 6, 12, 0, "rgba(59, 166, 230, 0.8)");
      fillCircle(context, footX, footY - 14, 4.5, "rgba(59, 166, 230, 0.8)");
    }
  }
  context.setLineDash([10, 8]);
  context.strokeStyle = "rgba(59, 166, 230, 0.7)";
  context.lineWidth = 4;
  context.beginPath();
  context.moveTo(toFloorX(0.98), toFloorY(-4.3));
  context.lineTo(toFloorX(1.82), toFloorY(-4.3));
  context.stroke();
  context.setLineDash([]);
  context.fillStyle = "rgba(99, 183, 91, 0.75)";
  const arrowX = toFloorX(-2);
  const arrowY = toFloorY(-6.55);
  context.beginPath();
  context.moveTo(arrowX, arrowY - 26);
  context.lineTo(arrowX + 18, arrowY - 4);
  context.lineTo(arrowX + 7, arrowY - 4);
  context.lineTo(arrowX + 7, arrowY + 20);
  context.lineTo(arrowX - 7, arrowY + 20);
  context.lineTo(arrowX - 7, arrowY - 4);
  context.lineTo(arrowX - 18, arrowY - 4);
  context.closePath();
  context.fill();
}

function createFanMesh(radius) {
  const bucket = new GeometryBucket();
  for (let blade = 0; blade < 4; blade += 1) {

function registerFan(position, rotation, localOffset, radius, speed) {
  const pivot = new THREE7.Object3D();

// assets/props/buildGuardrail.js
function buildGuardrail(startX, startZ, endX, endZ) {
  const outlined = W.buckets.outlined;
  const white = { color: "#e9ecef" };
  const length = Math.hypot(endX - startX, endZ - startZ);
  const postCount = Math.max(2, Math.round(length / 1.5) + 1);
  for (let index = 0; index < postCount; index += 1) {
    const t = index / (postCount - 1);
    const x = startX + (endX - startX) * t;
    const z = startZ + (endZ - startZ) * t;
    addCylinder(outlined, [x, LOT_Y + 0.45, z], 0.035, 0.9, white, { segments: 8 });
    addSphere(outlined, [x, LOT_Y + 0.9, z], 0.036, white);
  }
  for (const height of [0.5, 0.85]) {
    addRod(outlined, [startX, LOT_Y + height, startZ], [endX, LOT_Y + height, endZ], 0.03, white, 8);
  }
}

function buildGondola(centerX, frontZ, backZ, leftCategory, rightCategory, endCategory, popIndex) {
  const outlined = W.buckets.outlined;
  const halfWidth = 0.4;
  const length = frontZ - backZ;
  addBlock(outlined, [centerX - halfWidth, FLOOR_Y, backZ], [centerX + halfWidth, 0.37, frontZ], { color: "#5b5f66" });
  addBlock(outlined, [centerX - 0.03, 0.37, backZ], [centerX + 0.03, 1.5, frontZ], { color: "#efe9dc" });
  const shelfLevels = [0.37, 0.72, 1.07, 1.42];
  shelfLevels.forEach((shelfY, level) => {
    for (const side of [-1, 1]) {
      const outer = centerX + side * halfWidth;
      const inner = centerX + side * 0.03;
      addBlock(outlined, [Math.min(inner, outer), shelfY, backZ], [Math.max(inner, outer), shelfY + 0.025, frontZ], { color: "#f3efe6" });
      addBlock(W.buckets.plain, [outer - 0.01, shelfY - 0.03, backZ], [outer + 0.01, shelfY + 0.025, frontZ], { color: "#ffffff", faces: { [side > 0 ? FACE.px : FACE.nx]: { map: W.atlasRects.priceStrip } } });
      const maxHeight = level < shelfLevels.length - 1 ? shelfLevels[level + 1] - shelfY - 0.05 : 0.28;
      placeProducts([outer, frontZ], [0, -1], [side, 0], length, shelfY + 0.025, maxHeight, side < 0 ? leftCategory : rightCategory);
    }
  });
  addBlock(outlined, [centerX - halfWidth, FLOOR_Y, backZ - 0.03], [centerX + halfWidth, 1.5, backZ], { color: "#e2dccf" });
  addBlock(outlined, [centerX - halfWidth, FLOOR_Y, frontZ], [centerX + halfWidth, 1.5, frontZ + 0.03], { color: "#e2dccf" });
  for (const shelfY of [0.62, 1.02]) {
    addBlock(outlined, [centerX - halfWidth, shelfY, frontZ + 0.03], [centerX + halfWidth, shelfY + 0.025, frontZ + 0.3], { color: "#f3efe6" });
    placeProducts([centerX - halfWidth + 0.02, frontZ + 0.3], [1, 0], [0, 1], halfWidth * 2 - 0.04, shelfY + 0.025, 0.3, endCategory);
  }
  addBlock(outlined, [centerX - 0.32, 1.5, frontZ - 0.01], [centerX + 0.32, 1.72, frontZ + 0.01], { color: "#ffffff", faces: { [FACE.pz]: { map: getSubRect(W.atlasRects.popSigns, popIndex, 0, 4, 1) } } });

// assets/props/buildUtilityPole.js
function buildUtilityPole(options) {
  const outlined = W.buckets.outlined;
  const { adRect, armDirection, guyDirection, hasSecurityLight, hasTransformer, x, z } = options;
  const [armX, armZ] = armDirection;
  const perpendicularX = -armZ;
  const perpendicularZ = armX;
  addCylinder(outlined, [x, LOT_Y + 4.5, z], 0.17, 9, { color: "#b4afa4" }, { segments: 14, topRadius: 0.12 });
  addCylinder(outlined, [x, LOT_Y + 0.95, z], 0.18, 1.7, { channel: CHANNEL.steady, color: "#ffffff", emissive: 0.12, map: W.atlasRects.poleGuard }, { segments: 14 });
  for (let index = 0; index < 11; index += 1) {
    const y = LOT_Y + 2.4 + index * 0.45;
    const sign = index % 2 === 0 ? 1 : -1;
    addRod(outlined, [x, y, z], [x + perpendicularX * sign * 0.3, y, z + perpendicularZ * sign * 0.3], 0.012, { color: "#6b6f75" }, 5);
  }
  const topY = LOT_Y + 8.75;
  const middleY = LOT_Y + 8.2;
  addRod(outlined, [x - armX * 0.95, topY, z - armZ * 0.95], [x + armX * 0.95, topY, z + armZ * 0.95], 0.045, { color: "#6d737b" }, 6);
  addRod(outlined, [x - armX * 0.7, middleY, z - armZ * 0.7], [x + armX * 0.7, middleY, z + armZ * 0.7], 0.04, { color: "#6d737b" }, 6);
  const top = [];
  for (const offset of [-0.78, 0, 0.78]) {
    const pointX = x + armX * offset;
    const pointZ = z + armZ * offset;
    addCylinder(outlined, [pointX, topY + 0.09, pointZ], 0.04, 0.12, { color: "#e8e4dc" }, { segments: 8, topRadius: 0.03 });
    top.push([pointX, topY + 0.16, pointZ]);
  }
  const middle = [];
  for (const offset of [-0.55, 0.55]) {
    const pointX = x + armX * offset;
    const pointZ = z + armZ * offset;
    addCylinder(outlined, [pointX, middleY + 0.08, pointZ], 0.035, 0.1, { color: "#e8e4dc" }, { segments: 8, topRadius: 0.028 });
    middle.push([pointX, middleY + 0.14, pointZ]);
  }
  const cable = [x, LOT_Y + 5.6, z];
  addCylinder(outlined, [x, LOT_Y + 5.6, z], 0.19, 0.12, { color: "#3a3d42" }, { segments: 10 });
  if (hasTransformer) {
    const transformerX = x - perpendicularX * 0.42;
    const transformerZ = z - perpendicularZ * 0.42;
    addCylinder(outlined, [transformerX, LOT_Y + 6.6, transformerZ], 0.27, 0.75, { color: "#9da4ab" }, { segments: 14 });
    addCylinder(outlined, [transformerX, LOT_Y + 7.02, transformerZ], 0.29, 0.08, { color: "#8a9198" }, { segments: 14 });
    addRod(outlined, [x, LOT_Y + 6.3, z], [transformerX, LOT_Y + 6.3, transformerZ], 0.03, { color: "#6d737b" }, 5);
    addRod(outlined, [x, LOT_Y + 6.9, z], [transformerX, LOT_Y + 6.9, transformerZ], 0.03, { color: "#6d737b" }, 5);
    for (const offset of [-0.12, 0.12]) {
      addCylinder(outlined, [transformerX + armX * offset, LOT_Y + 7.14, transformerZ + armZ * offset], 0.025, 0.1, { color: "#e8e4dc" }, { segments: 6 });
    }
  }
  if (hasSecurityLight) {
    addRod(outlined, [x, LOT_Y + 4.75, z], [x, LOT_Y + 4.85, z + 0.72], 0.02, { color: "#8a9198" }, 5);
    addBox(outlined, [x, LOT_Y + 4.83, z + 0.78], [0.52, 0.09, 0.14], { color: "#e9ecef" });
    addBox(outlined, [x, LOT_Y + 4.775, z + 0.78], [0.42, 0.025, 0.08], { channel: CHANNEL.securityLight, color: "#e8f6ff", emissive: 4 });
  }
  if (adRect) {
    const adAngle = Math.atan2(perpendicularX, perpendicularZ);
    addBox(outlined, [x + perpendicularX * 0.2, LOT_Y + 2.75, z + perpendicularZ * 0.2], [0.3, 1.2, 0.02], { color: "#e8e8e2", faces: { [FACE.pz]: { map: adRect } } }, [0, adAngle, 0]);
    addBox(outlined, [x - armX * 0.2, LOT_Y + 2.05, z - armZ * 0.2], [0.34, 0.11, 0.015], { color: "#1f5aa8", faces: { [FACE.pz]: { map: W.atlasRects.addressPlate } } }, [0, Math.atan2(-armX, -armZ), 0]);
  }
  if (guyDirection) {
    const anchor = [x + guyDirection[0] * 3, LOT_Y, z + guyDirection[1] * 3];
    const attach = [x, LOT_Y + 7.8, z];
    addRod(outlined, attach, anchor, 0.012, { color: "#2a2c30" }, 4);
    const guardEnd = [anchor[0] + (attach[0] - anchor[0]) * 0.26, anchor[1] + (attach[1] - anchor[1]) * 0.26, anchor[2] + (attach[2] - anchor[2]) * 0.26];
    addRod(outlined, anchor, guardEnd, 0.045, { channel: CHANNEL.steady, color: "#f2c230", emissive: 0.1 }, 8);
    addBlock(outlined, [anchor[0] - 0.12, LOT_Y, anchor[2] - 0.12], [anchor[0] + 0.12, LOT_Y + 0.05, anchor[2] + 0.12], { color: COLORS.concrete });
  }
  return { cable, middle, top, x, z };
}

// assets/props/buildPolesAndWires.js
function buildPolesAndWires() {
  const first = [-7.8, 4.95];
  const second = [0.9, 11.2];
  const third = [11.2, -5.5];
  const firstArm = getLeftPerpendicular(first[0], first[1], second[0], second[1]);
  const thirdArm = getLeftPerpendicular(second[0], second[1], third[0], third[1]);
  const middleArmRaw = [firstArm[0] + thirdArm[0], firstArm[1] + thirdArm[1]];
  const middleLength = Math.hypot(middleArmRaw[0], middleArmRaw[1]);
  const middleArm = [middleArmRaw[0] / middleLength, middleArmRaw[1] / middleLength];
  const poleOne = buildUtilityPole({ adRect: W.atlasRects.poleAdDentist, armDirection: firstArm, guyDirection: [-1, 0], hasSecurityLight: true, hasTransformer: true, x: first[0], z: first[1] });
  const poleTwo = buildUtilityPole({ adRect: W.atlasRects.poleAdRealty, armDirection: middleArm, hasTransformer: false, x: second[0], z: second[1] });
  const poleThree = buildUtilityPole({ armDirection: thirdArm, guyDirection: [0, -1], hasTransformer: true, x: third[0], z: third[1] });
  for (let index = 0; index < 3; index += 1) {
    addWire(poleOne.top[index], poleTwo.top[index], 0.55, 0.016);
    addWire(poleTwo.top[index], poleThree.top[index], 0.75, 0.016);
  }
  for (let index = 0; index < 2; index += 1) {
    addWire(poleOne.middle[index], poleTwo.middle[index], 0.5, 0.016);
    addWire(poleTwo.middle[index], poleThree.middle[index], 0.7, 0.016);
  }
  addWire(poleOne.cable, poleTwo.cable, 0.4, 0.03);
  addWire(poleTwo.cable, poleThree.cable, 0.55, 0.03);
  addWire([poleOne.x, LOT_Y + 6.3, poleOne.z], [-5.1, 3.95, -1.1], 0.25, 0.012);
  addWire([poleOne.x, LOT_Y + 6.1, poleOne.z], [-7.45, 5.7, -2.3], 0.2, 0.012);
  addWire(poleThree.cable, [11.2, LOT_Y + 5.7, -10.8], 0.15, 0.02);
}

// assets/regions/drawManhole.js
function drawManhole(context, x, z) {
  const centerX = toGroundX(x);
  const centerY = toGroundY(z);
  const radius = 0.34 * GROUND_SCALE;
  fillCircle(context, centerX, centerY, radius, "#26292f");
  fillCircle(context, centerX, centerY, radius * 0.9, "#3d4149");
  context.save();
  context.beginPath();
  context.arc(centerX, centerY, radius * 0.86, 0, Math.PI * 2);
  context.clip();
  context.strokeStyle = "#555a63";
  context.lineWidth = 2;
  for (let offset = -radius; offset < radius; offset += 7) {
    context.beginPath();
    context.moveTo(centerX + offset, centerY - radius);
    context.lineTo(centerX + offset + radius, centerY + radius);
    context.moveTo(centerX + offset, centerY + radius);
    context.lineTo(centerX + offset + radius, centerY - radius);
    context.stroke();
  }
  context.restore();
  fillCircle(context, centerX, centerY, radius * 0.28, "#4a4f58");
  drawStar(context, centerX, centerY, radius * 0.2, "#666c76");
}

// assets/systems/updateReflectionCamera.js
function updateReflectionCamera() {
  W.camera.updateMatrixWorld();
  const { clipPlane, farCorner, look, plane, planePoint, position, up } = W.reflectionScratch;
  position.setFromMatrixPosition(W.camera.matrixWorld);
  look.set(0, 0, -1).applyQuaternion(W.camera.quaternion).add(position);
  up.set(0, 1, 0).applyQuaternion(W.camera.quaternion);
  reflectionCamera.position.set(position.x, -position.y, position.z);
  reflectionCamera.up.set(up.x, -up.y, up.z);
  reflectionCamera.lookAt(look.x, -look.y, look.z);
  reflectionCamera.near = W.camera.near;
  reflectionCamera.far = W.camera.far;
  reflectionCamera.updateMatrixWorld();
  reflectionCamera.projectionMatrix.copy(W.camera.projectionMatrix);
  reflectionMatrix.set(0.5, 0, 0, 0.5, 0, 0.5, 0, 0.5, 0, 0, 0.5, 0.5, 0, 0, 0, 1);
  reflectionMatrix.multiply(reflectionCamera.projectionMatrix);
  reflectionMatrix.multiply(reflectionCamera.matrixWorldInverse);
  plane.setFromNormalAndCoplanarPoint(W.Y_AXIS, planePoint);
  plane.applyMatrix4(reflectionCamera.matrixWorldInverse);
  clipPlane.set(plane.normal.x, plane.normal.y, plane.normal.z, plane.constant);
  const elements = reflectionCamera.projectionMatrix.elements;
  farCorner.set(
    (Math.sign(clipPlane.x) + elements[8]) / elements[0],
    (Math.sign(clipPlane.y) + elements[9]) / elements[5],
    -1,
    (1 + elements[10]) / elements[14]
  );
  clipPlane.multiplyScalar(2 / clipPlane.dot(farCorner));
  elements[2] = clipPlane.x;
  elements[6] = clipPlane.y;
  elements[10] = clipPlane.z + 1;
  elements[14] = clipPlane.w;
  reflectionCamera.projectionMatrixInverse.copy(reflectionCamera.projectionMatrix).invert();
}

// assets/systems/renderFrame.js
function renderFrame(deltaTime) {
  updateReflectionCamera();
  W.renderer.shadowMap.needsUpdate = true;
  W.renderer.setRenderTarget(W.reflectionTarget);
  W.renderer.render(W.scene, reflectionCamera);
  W.camera.layers.set(LAYER_OUTLINED);
  W.camera.layers.enable(LAYER_GROUND);
  W.scene.overrideMaterial = W.normalPassMaterial;
  W.scene.background = null;
  W.renderer.setClearColor(W.normalClearColor, 1);
  W.renderer.setRenderTarget(W.normalTarget);
  W.renderer.render(W.scene, W.camera);
  W.scene.overrideMaterial = null;
  W.scene.background = W.backgroundTexture;
  W.renderer.setClearColor(W.blackColor, 1);
  W.camera.layers.enableAll();
  W.renderer.setRenderTarget(W.sceneTarget);
  W.renderer.render(W.scene, W.camera);
  W.compositeMaterial.uniforms.tColor.value = W.sceneTarget.texture;
  W.compositeMaterial.uniforms.tNormal.value = W.normalTarget.texture;
  W.compositeMaterial.uniforms.tDepth.value = W.normalTarget.depthTexture;
  W.renderer.setRenderTarget(W.compositeTarget);
  W.compositeQuad.render(W.renderer);
  W.bloomPass.render(W.renderer, null, W.compositeTarget, deltaTime, false);
  W.gradeMaterial.uniforms.tInput.value = W.compositeTarget.texture;
  W.renderer.setRenderTarget(W.gradeTarget);
  W.gradeQuad.render(W.renderer);
  W.fxaaMaterial.uniforms.tDiffuse.value = W.gradeTarget.texture;
  W.renderer.setRenderTarget(null);
  W.fxaaQuad.render(W.renderer);
}

// assets/systems/handleResize.js
function handleResize() {
  W.viewportWidth = Math.max(1, window.innerWidth);
  W.viewportHeight = Math.max(1, window.innerHeight);
  const pixelRatio = computePixelRatio();
  W.renderer.setPixelRatio(pixelRatio);
  W.renderer.setSize(W.viewportWidth, W.viewportHeight, false);
  const drawingWidth = Math.max(1, Math.floor(W.viewportWidth * pixelRatio));
  const drawingHeight = Math.max(1, Math.floor(W.viewportHeight * pixelRatio));
  W.camera.aspect = W.viewportWidth / W.viewportHeight;
  W.camera.updateProjectionMatrix();
  W.sceneTarget.setSize(drawingWidth, drawingHeight);
  W.normalTarget.setSize(drawingWidth, drawingHeight);
  W.compositeTarget.setSize(drawingWidth, drawingHeight);
  W.gradeTarget.setSize(drawingWidth, drawingHeight);
  W.reflectionTarget.setSize(Math.max(1, Math.floor(drawingWidth / 2)), Math.max(1, Math.floor(drawingHeight / 2)));
  W.bloomPass.setSize(drawingWidth, drawingHeight);
  W.compositeMaterial.uniforms.uResolution.value.set(drawingWidth, drawingHeight);
  W.compositeMaterial.uniforms.uLineWidth.value = Math.max(1, pixelRatio * 0.75);
  W.compositeMaterial.uniforms.uCameraNear.value = W.camera.near;
  W.compositeMaterial.uniforms.uCameraFar.value = W.camera.far;
  W.gradeMaterial.uniforms.uResolution.value.set(drawingWidth, drawingHeight);
  W.fxaaMaterial.uniforms.resolution.value.set(1 / drawingWidth, 1 / drawingHeight);
}

// assets/systems/trackPerformance.js
function trackPerformance(deltaTime) {
  if (performanceMonitor.hasSettled) {
    return;
  }
  if (performanceMonitor.warmup > 0) {
    performanceMonitor.warmup -= deltaTime;
    return;
  }
  performanceMonitor.elapsed += deltaTime;
  performanceMonitor.frames += 1;
  if (performanceMonitor.elapsed < 2.5) {
    return;
  }
  const averageFrameTime = performanceMonitor.elapsed / performanceMonitor.frames;
  performanceMonitor.elapsed = 0;
  performanceMonitor.frames = 0;
  if (averageFrameTime > 1 / 38 && W.qualityScale > 0.6) {
    W.qualityScale *= 0.82;
    handleResize();
    performanceMonitor.warmup = 0.5;
    return;
  }
  performanceMonitor.hasSettled = true;
}

// assets/systems/updateCat.js
function updateCat(time) {
  const sway = Math.sin(time * 1.3) * 0.22 + Math.sin(time * 3.7) * 0.05;
  const flickCycle = time % 6.5;
  const flick = flickCycle < 0.4 ? Math.sin(flickCycle / 0.4 * Math.PI) * 0.35 : 0;
  W.catTail.rotation.y = W.catTailBaseRotation + sway + flick;
}

// assets/systems/updateChannels.js
function updateChannels(time) {
  const levels = W.sharedUniforms.uChannelLevels.value;
  const signalState = getSignalState(time);
  const cycle = time % 24;
  const isWalkFlashing = cycle > 7 && cycle < 10 && Math.floor(time * 4) % 2 === 0;
  levels[CHANNEL.steady] = 1;
  levels[CHANNEL.storeSign] = computeStoreSignLevel(time);
  levels[CHANNEL.poleSign] = 1;
  levels[CHANNEL.poleSignSub] = computeFailingTubeLevel(time);
  levels[CHANNEL.interiorLights] = 1;
  levels[CHANNEL.vending] = 0.97 + 0.03 * Math.sin(time * 3.1);
  levels[CHANNEL.signalGreen] = signalState === "green" ? 1 : 0.05;
  levels[CHANNEL.signalYellow] = signalState === "yellow" ? 1 : 0.05;
  levels[CHANNEL.signalRed] = signalState === "red" ? 1 : 0.05;
  levels[CHANNEL.walkGreen] = signalState === "green" && !isWalkFlashing ? 1 : 0.05;
  levels[CHANNEL.walkRed] = signalState === "green" ? 0.05 : 1;
  levels[CHANNEL.alleyLamp] = 0.86 + 0.08 * Math.sin(time * 2.3) + 0.06 * Math.sin(time * 7.1 + 1.3);
  levels[CHANNEL.securityLight] = computeSecurityLevel(time);
  levels[CHANNEL.doorSensor] = W.door.phase === "closed" ? 0.25 : 0.6 + 0.4 * Math.sin(time * 30);
  levels[CHANNEL.hangingSign] = computeHangingSignLevel(time);
  levels[CHANNEL.neighborTv] = computeTelevisionLevel(time);
  W.lights.signal.color.copy(SIGNAL_COLORS[signalState]);
  W.lights.security.intensity = W.lights.security.userData.baseIntensity * levels[CHANNEL.securityLight];
  W.lights.alleyLamp.intensity = W.lights.alleyLamp.userData.baseIntensity * levels[CHANNEL.alleyLamp];
  W.lights.poleSign.intensity = W.lights.poleSign.userData.baseIntensity * (0.85 + 0.15 * levels[CHANNEL.poleSignSub]);
  W.lights.frontSpill.intensity = W.lights.frontSpill.userData.baseIntensity * (1 + 0.08 * W.door.openAmount);
  rainLights[5].color.setRGB(0.8, 0.95, 1.1).multiplyScalar(levels[CHANNEL.securityLight]);
  rainLights[6].color.copy(SIGNAL_COLORS[signalState]).multiplyScalar(0.9);
}

// assets/systems/updateDoor.js
function updateDoor(deltaTime) {
  W.door.timer -= deltaTime;
  switch (W.door.phase) {
    case "closed": {
      if (W.door.timer <= 0) {
        W.door.phase = "opening";
      }
      break;
    }
    case "opening": {
      W.door.openAmount = Math.min(1, W.door.openAmount + deltaTime / 0.9);
      if (W.door.openAmount >= 1) {
        W.door.phase = "open";
        W.door.timer = randomBetween(2.2, 3.4);
      }
      break;
    }
    case "open": {
      if (W.door.timer <= 0) {
        W.door.phase = "closing";
      }
      break;
    }
    case "closing": {
      W.door.openAmount = Math.max(0, W.door.openAmount - deltaTime / 1.25);
      if (W.door.openAmount <= 0) {
        W.door.phase = "closed";
        W.door.timer = randomBetween(8, 15);
      }
      break;
    }
  }
  const eased = W.door.openAmount * W.door.openAmount * (3 - 2 * W.door.openAmount);
  W.door.leftPanel.position.x = 1.475 - 0.75 * eased;
  W.door.rightPanel.position.x = 2.325 + 0.75 * eased;
}

// assets/systems/triggerSplash.js
function triggerSplash(x, y, z, time) {
  const offset = (SPLASH_COUNT + W.splashState.nextExtraSlot) * 4;
  W.splashState.nextExtraSlot = (W.splashState.nextExtraSlot + 1) % SPLASH_EXTRA;
  W.splashState.data[offset] = x;
  W.splashState.data[offset + 1] = y;
  W.splashState.data[offset + 2] = z;
  W.splashState.data[offset + 3] = time;
}

// assets/systems/updateDrips.js
function updateDrips(time) {
  const gravity = 9.8;
  for (let index = 0; index < dripSources.length; index += 1) {
    const source = dripSources[index];
    const fallDuration = Math.sqrt(2 * (source.y - source.groundY) / gravity);
    const hangDuration = Math.max(0.3, source.period - fallDuration);
    const cycleLength = hangDuration + fallDuration + 0.05;
    const localTime = (time + source.phase) % cycleLength;
    const cycle = Math.floor((time + source.phase) / cycleLength);
    const offset = index * 4;
    W.dripState.data[offset] = source.x;
    W.dripState.data[offset + 2] = source.z;
    if (localTime < hangDuration) {
      const growth = localTime / hangDuration;
      W.dripState.data[offset + 1] = source.y - 0.012 * growth;
      W.dripState.data[offset + 3] = 8e-3 + 0.01 * growth;
      W.dripState.stretch[index] = 0.3 * growth;
      continue;
    }
    const fallTime = localTime - hangDuration;
    if (fallTime < fallDuration) {
      W.dripState.data[offset + 1] = source.y - 0.5 * gravity * fallTime * fallTime;
      W.dripState.data[offset + 3] = 0.014;
      W.dripState.stretch[index] = Math.min(6, gravity * fallTime * 0.4);
      continue;
    }
    W.dripState.data[offset + 3] = 0;
    if (source.lastSplashCycle !== cycle) {
      source.lastSplashCycle = cycle;
      triggerSplash(source.x, source.groundY + 0.01, source.z, time);
    }
  }
  W.dripState.attribute.needsUpdate = true;
  W.dripState.stretchAttribute.needsUpdate = true;
}

// assets/systems/updateFans.js
function updateFans(deltaTime) {
  for (const fan of W.fans) {
    fan.mesh.rotation.z += fan.speed * deltaTime;
  }
}

// assets/systems/updateOverflowStream.js
function updateOverflowStream(time) {
  if (time - W.overflowStream.lastSplash > 0.07) {
    W.overflowStream.lastSplash = time;
    triggerSplash(W.overflowStream.x + 0.03 + randomBetween(-0.03, 0.03), LOT_Y + 0.01, W.overflowStream.z + randomBetween(-0.03, 0.03), time);
  }
}

// assets/systems/respawnSplash.js
function respawnSplash(offset, startTime) {
  const pick = random() * W.splashState.totalWeight;
  let surface = SPLASH_SURFACES[0];
  for (let index = 0; index < SPLASH_SURFACES.length; index += 1) {
    if (pick <= W.splashState.cumulativeWeights[index]) {
      surface = SPLASH_SURFACES[index];
      break;
    }
  }
  W.splashState.data[offset] = randomBetween(surface.minX, surface.maxX);
  W.splashState.data[offset + 1] = surface.y + 0.01;
  W.splashState.data[offset + 2] = randomBetween(surface.minZ, surface.maxZ);
  W.splashState.data[offset + 3] = startTime;
}

// assets/systems/updateSplashes.js
function updateSplashes(time) {
  const data = W.splashState.data;
  for (let index = 0; index < SPLASH_COUNT; index += 1) {
    const offset = index * 4;
    if (time - data[offset + 3] > SPLASH_LIFE) {
      respawnSplash(offset, time + random() * 0.5);
    }
  }
  W.splashState.attribute.needsUpdate = true;
}

// assets/systems/animate.js
function animate() {
  const deltaTime = Math.min(W.clock.getDelta(), 0.1);
  W.elapsedTime += deltaTime;
  W.sharedUniforms.uTime.value = W.elapsedTime;
  W.controls.update(deltaTime);
  updateDoor(deltaTime);
  updateChannels(W.elapsedTime);
  updateFans(deltaTime);
  updateCat(W.elapsedTime);
  updateSplashes(W.elapsedTime);
  updateDrips(W.elapsedTime);
  updateOverflowStream(W.elapsedTime);
  renderFrame(deltaTime);
  trackPerformance(deltaTime);
}

// assets/systems/createDrips.js
function createDrips() {
  registerDripSources();
  const count = dripSources.length;
  const geometry = createQuadGeometry(-1, 1, -1, 1);
  W.dripState.data = new Float32Array(count * 4);
  W.dripState.stretch = new Float32Array(count);
  W.dripState.attribute = new THREE15.InstancedBufferAttribute(W.dripState.data, 4);
  W.dripState.attribute.setUsage(THREE15.DynamicDrawUsage);
  W.dripState.stretchAttribute = new THREE15.InstancedBufferAttribute(W.dripState.stretch, 1);
  W.dripState.stretchAttribute.setUsage(THREE15.DynamicDrawUsage);
  geometry.setAttribute("aDrip", W.dripState.attribute);
  geometry.setAttribute("aStretch", W.dripState.stretchAttribute);
  geometry.instanceCount = count;
  const material = new THREE15.ShaderMaterial({
    blending: THREE15.AdditiveBlending,
    depthWrite: false,
    side: THREE15.DoubleSide,
    fragmentShader: (
      /* glsl */
      `
      varying vec2 vQuad;
      varying vec3 vTint;
      void main() {
        float mask = smoothstep(1.0, 0.2, length(vQuad));
        gl_FragColor = vec4(vTint * mask * 1.3, 1.0);
      }
    `
    ),
    transparent: true,
    uniforms: { ...rainLightUniforms },
    vertexShader: (
      /* glsl */
      `
      attribute vec4 aDrip;
      attribute float aStretch;
      varying vec2 vQuad;
      varying vec3 vTint;
      ${LIGHT_TINT_CHUNK}
      void main() {
        vQuad = position.xy;
        vTint = vec3(0.0);
        if (aDrip.w <= 0.0) {
          gl_Position = vec4(2.0, 2.0, 2.0, 1.0);
          return;
        }
        vec3 cameraRight = vec3(viewMatrix[0][0], viewMatrix[1][0], viewMatrix[2][0]);
        float height = aDrip.w * (1.0 + aStretch);
        vec3 worldPosition = aDrip.xyz + cameraRight * position.x * aDrip.w + vec3(0.0, position.y * height, 0.0);
        vTint = computeLightTint(aDrip.xyz, vec3(0.35, 0.42, 0.55));
        gl_Position = projectionMatrix * viewMatrix * vec4(worldPosition, 1.0);
      }
    `
    )
  });
  addEffectMesh(geometry, material);
}

// assets/systems/createOverflowStream.js
import * as THREE16 from "three";
function createOverflowStream() {
  const top = new THREE16.Vector3(W.overflowStream.x, 2.93, W.overflowStream.z);
  const material = new THREE16.ShaderMaterial({
    blending: THREE16.AdditiveBlending,
    depthWrite: false,
    side: THREE16.DoubleSide,
    fragmentShader: (
      /* glsl */
      `
      uniform float uTime;
      varying vec2 vUv;
      void main() {
        float core = clamp(1.0 - abs(vUv.x - 0.5) * 2.0, 0.0, 1.0);
        float streak = 0.55 + 0.45 * sin(vUv.y * 90.0 + uTime * 55.0 + sin(vUv.x * 9.0) * 2.0);
        float fade = smoothstep(0.0, 0.06, vUv.y) * smoothstep(1.0, 0.95, vUv.y);
        gl_FragColor = vec4(vec3(0.8, 0.88, 1.05) * core * streak * fade * 0.9, 1.0);
      }
    `
    ),
    transparent: true,
    uniforms: { uLength: { value: 2.93 - LOT_Y }, uTime: W.sharedUniforms.uTime, uTop: { value: top }, uWidth: { value: 0.03 } },
    vertexShader: (
      /* glsl */
      `
      uniform vec3 uTop;
      uniform float uLength;
      uniform float uWidth;
      uniform float uTime;
      varying vec2 vUv;
      void main() {
        vUv = uv;
        vec3 toCamera = cameraPosition - uTop;
        toCamera.y = 0.0;
        toCamera = normalize(toCamera + vec3(0.0001));
        vec3 side = normalize(cross(vec3(0.0, 1.0, 0.0), toCamera));
        float along = 0.5 - position.y;
        float wobble = sin(along * 14.0 + uTime * 23.0) * 0.004 * along;
        vec3 worldPosition = uTop + side * (position.x * uWidth * (1.0 + along * 0.6) + wobble) + vec3(0.03 * along * along, -along * uLength, 0.0);
        gl_Position = projectionMatrix * viewMatrix * vec4(worldPosition, 1.0);
      }
    `
    )
  });
  const mesh = new THREE16.Mesh(new THREE16.PlaneGeometry(1, 1, 1, 16), material);
  mesh.frustumCulled = false;
  mesh.layers.set(LAYER_EFFECTS);
  W.scene.add(mesh);
}

      `
      uniform float uOpacity;
      varying float vAlong;
      varying float vAcross;
      varying vec3 vTint;
      varying float vVisible;
      void main() {
        if (vVisible < 0.01) {
          discard;
        }
        // Thin streaks under MSAA sample varyings outside the quad, so clamp before weighting.
        float core = clamp(1.0 - abs(vAcross) * 2.0, 0.0, 1.0);
        float intensity = core * clamp(1.0 - vAlong, 0.0, 1.0) * vVisible * uOpacity;
        gl_FragColor = vec4(vTint * intensity, 1.0);
      }
    `
    ),
    transparent: true,
    uniforms: { ...rainLightUniforms, uOpacity: { value: 0.55 }, uTime: W.sharedUniforms.uTime },
    vertexShader: (
      /* glsl */
      `
      uniform float uTime;
      attribute vec4 aSeed;
      varying float vAlong;
      varying float vAcross;
      varying vec3 vTint;
      varying float vVisible;
      ${LIGHT_TINT_CHUNK}
      float getBlockedHeight(vec2 point) {
        if (point.x > -5.3 && point.x < 3.95 && point.y > -8.05 && point.y < 0.45) {
          return point.y > -0.98 ? 3.0 : 4.08;
        }
        if (point.x < -7.0 && point.y > -11.9 && point.y < -1.9) {
          return 7.0;
        }
        if (point.x > 3.8 && point.x < 4.62 && point.y > -6.35 && point.y < -4.2) {
          return 1.9;
        }
        return 0.05;
      }
      void main() {
        float speed = 12.5 + aSeed.w * 5.0;
        float top = 15.0;
        float fall = mod(aSeed.z * top + uTime * speed, top);
        float headY = top - fall;
        vec2 groundPosition = aSeed.xy + vec2(0.09, 0.035) * fall;
        groundPosition = mod(groundPosition + 12.0, 24.0) - 12.0;
        vVisible = step(getBlockedHeight(groundPosition), headY);
        vec3 fallDirection = normalize(vec3(0.09, -1.0, 0.035));
        vec3 head = vec3(groundPosition.x, headY, groundPosition.y);
        float streakLength = 0.45 + aSeed.w * 0.4;
        vec3 toCamera = normalize(cameraPosition - head);
        vec3 side = normalize(cross(fallDirection, toCamera));
        float width = 0.018 + 0.01 * aSeed.w;
        vec3 worldPosition = head - fallDirection * streakLength * position.y + side * position.x * width;
        vTint = computeLightTint(head, vec3(0.26, 0.31, 0.42));
        vAlong = position.y;
        vAcross = position.x;
        float edgeFade = 1.0 - smoothstep(11.2, 12.0, max(abs(groundPosition.x), abs(groundPosition.y)));
        float topFade = 1.0 - smoothstep(top - 3.0, top, headY);
        float nearFade = smoothstep(1.5, 5.0, distance(cameraPosition, head));
        vVisible *= edgeFade * topFade * nearFade;
        gl_Position = projectionMatrix * viewMatrix * vec4(worldPosition, 1.0);
      }
    `
    )
  });
  addEffectMesh(geometry, material);
}

import * as THREE18 from "three";
function createSplashes() {
  let total = 0;
  for (const surface of SPLASH_SURFACES) {
    total += (surface.maxX - surface.minX) * (surface.maxZ - surface.minZ);
    W.splashState.cumulativeWeights.push(total);
  }
  W.splashState.totalWeight = total;
  const count = SPLASH_COUNT + SPLASH_EXTRA;
  W.splashState.data = new Float32Array(count * 4);
  for (let index = 0; index < SPLASH_COUNT; index += 1) {
    respawnSplash(index * 4, random() * 0.8);
  }
  for (let index = SPLASH_COUNT; index < count; index += 1) {
    W.splashState.data[index * 4 + 3] = -10;
  }
  const geometry = createQuadGeometry(-1, 1, 0, 1);
  W.splashState.attribute = new THREE18.InstancedBufferAttribute(W.splashState.data, 4);
  W.splashState.attribute.setUsage(THREE18.DynamicDrawUsage);
  geometry.setAttribute("aSplash", W.splashState.attribute);
  geometry.instanceCount = count;
  const material = new THREE18.ShaderMaterial({
    blending: THREE18.AdditiveBlending,
    depthWrite: false,
    side: THREE18.DoubleSide,
    fragmentShader: (
      /* glsl */
      `
      varying vec2 vQuad;
      varying float vProgress;
      varying vec3 vTint;
      void main() {
        float shape = 0.0;
        for (int droplet = 0; droplet < 5; droplet++) {
          float spread = (float(droplet) - 2.0) * 0.42;
          vec2 center = vec2(spread * vProgress * 1.1, (0.2 + 0.8 * (1.0 - abs(spread))) * 3.2 * vProgress * (1.0 - vProgress));
          shape += smoothstep(0.14, 0.03, length((vQuad - center) * vec2(1.0, 1.3)));
        }
        float ring = smoothstep(0.1, 0.0, abs(length(vQuad * vec2(1.0, 5.0)) - vProgress * 0.95)) * (1.0 - step(0.22, vQuad.y));
        float intensity = (shape + ring * 0.7) * (1.0 - vProgress);
        gl_FragColor = vec4(vTint * intensity * 0.45, 1.0);
      }
    `
    ),
    transparent: true,
    uniforms: { ...rainLightUniforms, uTime: W.sharedUniforms.uTime },
    vertexShader: (
      /* glsl */
      `
      uniform float uTime;
      attribute vec4 aSplash;
      varying vec2 vQuad;
      varying float vProgress;
      varying vec3 vTint;
      ${LIGHT_TINT_CHUNK}
      void main() {
        float progress = (uTime - aSplash.w) / ${SPLASH_LIFE.toFixed(2)};
        vProgress = progress;
        vQuad = position.xy;
        vTint = vec3(0.0);
        if (progress < 0.0 || progress > 1.0) {
          gl_Position = vec4(2.0, 2.0, 2.0, 1.0);
          return;
        }
        vec3 cameraRight = vec3(viewMatrix[0][0], viewMatrix[1][0], viewMatrix[2][0]);
        float size = 0.15;
        vec3 worldPosition = aSplash.xyz + cameraRight * position.x * size + vec3(0.0, position.y * size * 0.9, 0.0);
        vTint = computeLightTint(aSplash.xyz, vec3(0.3, 0.36, 0.46));
        gl_Position = projectionMatrix * viewMatrix * vec4(worldPosition, 1.0);
      }
    `
    )
  });
  addEffectMesh(geometry, material);
}

import * as THREE19 from "three";
function createSteam(origin, count, rise, spread, size, opacity) {
  const geometry = createQuadGeometry(-1, 1, -1, 1);
  const seeds = new Float32Array(count * 2);
  for (let index = 0; index < count; index += 1) {
    seeds[index * 2] = random();
    seeds[index * 2 + 1] = random();
  }
  geometry.setAttribute("aSeed", new THREE19.InstancedBufferAttribute(seeds, 2));
  geometry.instanceCount = count;
  const material = new THREE19.ShaderMaterial({
    blending: THREE19.AdditiveBlending,
    depthWrite: false,
    side: THREE19.DoubleSide,
    fragmentShader: (
      /* glsl */
      `
      uniform float uOpacity;
      varying vec2 vQuad;
      varying float vAlpha;
      void main() {
        float blob = smoothstep(1.0, 0.0, length(vQuad));
        gl_FragColor = vec4(vec3(1.0, 0.96, 0.9) * blob * blob * vAlpha * uOpacity, 1.0);
      }
    `
    ),
    transparent: true,
    uniforms: { uOpacity: { value: opacity }, uRise: { value: rise }, uSize: { value: size }, uSpread: { value: spread }, uTime: W.sharedUniforms.uTime },
    vertexShader: (
      /* glsl */
      `
      uniform float uTime;
      uniform float uRise;
      uniform float uSpread;
      uniform float uSize;
      attribute vec2 aSeed;
      varying vec2 vQuad;
      varying float vAlpha;
      void main() {
        float life = 2.4 + aSeed.y * 1.2;
        float progress = fract(uTime / life + aSeed.x);
        vec3 offset = vec3(sin(progress * 5.0 + aSeed.y * 9.0) * uSpread * progress, progress * uRise, cos(progress * 4.0 + aSeed.x * 7.0) * uSpread * progress);
        vec4 viewCenter = modelViewMatrix * vec4(offset, 1.0);
        viewCenter.xy += position.xy * uSize * (0.35 + progress * 1.3);
        vQuad = position.xy;
        vAlpha = smoothstep(0.0, 0.15, progress) * (1.0 - progress);
        gl_Position = projectionMatrix * viewCenter;
      }
    `
    )
  });
  const mesh = addEffectMesh(geometry, material);
  mesh.position.set(origin[0], origin[1], origin[2]);
}

import * as THREE21 from "three";
function placeInitialCamera() {
  const aspect = W.viewportWidth / W.viewportHeight;
  const distance = 50 * Math.max(1, Math.pow(1.5 / aspect, 0.85));
  const polar = THREE21.MathUtils.degToRad(64);
  const azimuth = THREE21.MathUtils.degToRad(36);
  W.camera.position.set(
    W.controls.target.x + distance * Math.sin(polar) * Math.sin(azimuth),
    W.controls.target.y + distance * Math.cos(polar),
    W.controls.target.z + distance * Math.sin(polar) * Math.cos(azimuth)
  );
  W.camera.lookAt(W.controls.target);
  W.controls.update();
}

// assets/systems/loadStylesheet.js
function loadStylesheet(url) {
  return new Promise((resolve) => {
    const link = document.createElement("link");
    link.rel = "stylesheet";
    link.href = url;
    link.addEventListener("load", () => {
      resolve(true);
    });
    link.addEventListener("error", () => {
      resolve(false);
    });
    document.head.appendChild(link);
  });
}

// assets/systems/waitFor.js
function waitFor(milliseconds) {
  return new Promise((resolve) => {
    setTimeout(resolve, milliseconds);
  });
}

// assets/systems/waitForFonts.js
async function waitForFonts() {
  if (FONT_STYLESHEETS.length === 0 || !document.fonts || typeof document.fonts.load !== "function") {
    return;
  }
  const stylesheetResults = await Promise.race([
    Promise.all(FONT_STYLESHEETS.map(loadStylesheet)),
    waitFor(2500).then(() => {
      return [];
    })
  ]);
  if (!stylesheetResults.some(Boolean)) {
    return;
  }
  const requests = [
    document.fonts.load('400 48px "Dela Gothic One"', TEXT_SAMPLE),
    document.fonts.load('800 48px "M PLUS Rounded 1c"', TEXT_SAMPLE),
    document.fonts.load('400 48px "Yusei Magic"', TEXT_SAMPLE)
  ];
  await Promise.race([Promise.allSettled(requests), waitFor(3e3)]);
}

  texture.anisotropy = W.renderer.capabilities.getMaxAnisotropy();
  return texture;
}
function drawWetMask() {
  const canvas = createCanvas(WET_SIZE, WET_SIZE);
  const context = canvas.getContext("2d");
  context.fillStyle = "rgb(0, 130, 0)";
  context.fillRect(0, 0, WET_SIZE, WET_SIZE);
  context.globalCompositeOperation = "lighter";
  for (let blob = 0; blob < 70; blob += 1) {
    addWetBlob(context, randomBetween(-12, 12), randomBetween(-12, 12), randomBetween(0.8, 3), randomBetween(0.8, 3), 0, 90, 0);
  }
  for (const puddle of PUDDLES) {
    const count = 5 + Math.floor(random() * 4);
    for (let blob = 0; blob < count; blob += 1) {
      const offsetX = (random() - 0.5) * puddle.width * 0.7;
      const offsetZ = (random() - 0.5) * puddle.depth * 0.7;
      addWetBlob(context, puddle.x + offsetX, puddle.z + offsetZ, puddle.width * randomBetween(0.3, 0.5), puddle.depth * randomBetween(0.3, 0.5), Math.round(150 * puddle.strength), 0, 0);
    }
  }
  for (let blob = 0; blob < 36; blob += 1) {
    const isFrontRoad = random() < 0.55;
    const x = isFrontRoad ? randomBetween(-11.5, 11.5) : randomBetween(5.8, 10.4);
    const z = isFrontRoad ? randomBetween(5.8, 10.4) : randomBetween(-11.5, 5);
    addWetBlob(context, x, z, randomBetween(0.15, 0.4), randomBetween(0.12, 0.3), 170, 0, 0);
  }
  context.fillStyle = "rgb(0, 0, 220)";
  context.fillRect(toWetX(-12), toWetY(5.62), 16.4 * WET_SCALE, 0.3 * WET_SCALE);
  context.fillRect(toWetX(-12), toWetY(10.28), 24 * WET_SCALE, 0.3 * WET_SCALE);
  context.fillRect(toWetX(5.62), toWetY(-12), 0.3 * WET_SCALE, 16.4 * WET_SCALE);
  context.fillRect(toWetX(10.28), toWetY(-12), 0.3 * WET_SCALE, 16.8 * WET_SCALE);
  context.fillRect(toWetX(-6.42), toWetY(-11.6), 0.34 * WET_SCALE, 15.2 * WET_SCALE);
  context.globalCompositeOperation = "source-over";
  const texture = new THREE22.CanvasTexture(canvas);
  texture.colorSpace = THREE22.NoColorSpace;
  return texture;
}
function createLotShape() {
  const shape = new THREE22.Shape();
  shape.moveTo(-12, 12);
  shape.lineTo(5.6, 12);
  shape.lineTo(5.6, -4.4);
  shape.absarc(4.4, -4.4, 1.2, 0, -Math.PI / 2, true);
  shape.lineTo(-12, -5.6);
  shape.closePath();
  return shape;
}
function createFarRightShape() {
  const shape = new THREE22.Shape();
  shape.moveTo(10.6, 12);
  shape.lineTo(12, 12);
  shape.lineTo(12, -5.6);
  shape.lineTo(11.4, -5.6);
  shape.absarc(11.4, -4.8, 0.8, -Math.PI / 2, -Math.PI, true);
  shape.closePath();
  return shape;
}
function createFarFrontShape() {
  const shape = new THREE22.Shape();
  shape.moveTo(-12, -10.6);
  shape.lineTo(12, -10.6);
  shape.lineTo(12, -12);
  shape.lineTo(-12, -12);
  shape.closePath();
  return shape;
}
function createGroundGeometry() {
  const pieces = [];
  const road = new THREE22.PlaneGeometry(24, 24, 1, 1);
  road.rotateX(-Math.PI / 2);
  pieces.push(road.toNonIndexed());
  for (const shape of [createLotShape(), createFarRightShape(), createFarFrontShape()]) {
    const extruded = new THREE22.ExtrudeGeometry(shape, { bevelEnabled: false, curveSegments: 12, depth: LOT_Y });
    extruded.rotateX(-Math.PI / 2);
    pieces.push(extruded.index ? extruded.toNonIndexed() : extruded);
  }
  for (const piece of pieces) {
    piece.clearGroups();
    piece.deleteAttribute("uv");
  }
  const merged = mergeGeometries(pieces, false);
  const position = merged.attributes.position;
  const uvs = new Float32Array(position.count * 2);
  for (let vertex = 0; vertex < position.count; vertex += 1) {
    uvs[vertex * 2] = (position.getX(vertex) + 12) / 24;
    uvs[vertex * 2 + 1] = 1 - (position.getZ(vertex) + 12) / 24;
  }
  merged.setAttribute("uv", new THREE22.BufferAttribute(uvs, 2));
  return merged;
}
